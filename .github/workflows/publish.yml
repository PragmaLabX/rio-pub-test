name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Требует создания GitHub Environment "npm-release" (Settings -> Environments)
    # с правилом Required reviewers и Deployment branches/tags = v*.*.*
    environment: npm-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points to a commit that is not on main — refusing to publish."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Trusted Publishing (OIDC) требует npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci

      - name: npm audit signatures
        run: |
          DEP_COUNT=$(node -p "Object.keys({...require('./package.json').dependencies, ...require('./package.json').devDependencies}).length")
          if [ "$DEP_COUNT" -gt 0 ]; then
            npm audit signatures
          else
            echo "No dependencies installed — skipping signature audit"
          fi

      - run: npm test

      - run: npm publish --provenance
